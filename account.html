<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Hearth account</title>
<meta name="description" content="Make your Hearth account, see invites to your friends' servers, and open the Hearths you've joined.">
<meta name="theme-color" content="#1F1E1D">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#1A1918;--panel:#262624;--raise:#30302E;--ink:#FAF9F5;--mute:#A6A39A;--line:#3A3936;--gold:#E5A91C;--gold2:#F2C14E;--goldink:#2A2418;--goldrgb:229,169,28;--ok:#6CC08B;--bad:#E8806F;
--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:-200px 0 auto;height:560px;background:radial-gradient(560px 280px at 50% 30%,rgba(var(--goldrgb),.12),transparent 70%);pointer-events:none;z-index:-1}
a{color:var(--gold2)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em;line-height:1.15;margin:0}
.nav{display:flex;align-items:center;gap:12px;padding:16px;max-width:1120px;margin:0 auto}
.nav img{width:32px;height:32px;transition:transform .35s var(--spring)}.nav a.brand:hover img{transform:scale(1.1) rotate(-6deg)}
.nav b{font:800 21px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}.nav a.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px}
.nav .right{margin-left:auto;display:flex;gap:14px;align-items:center;font-weight:500;white-space:nowrap;font-size:15px}.nav .right a{color:var(--mute);text-decoration:none;transition:color .2s}.nav .right a:hover{color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--goldink);font:800 13px 'Bricolage Grotesque',sans-serif;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:16px;animation:rise .42s var(--ease) backwards;animation-delay:calc(var(--i,0) * 60ms)}
.card h1{font-size:30px;margin-bottom:6px}.card h2{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
p.mute,.mute{color:var(--mute)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=email],input[type=password],input[type=text]{width:100%;background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;transition:border-color .2s,box-shadow .2s}
input:hover{border-color:#4a4945}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--goldrgb),.18)}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin-top:14px;cursor:pointer}.ck input{width:18px;height:18px;margin-top:3px;accent-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 22px;font:600 16px Figtree,sans-serif;text-decoration:none;border:1px solid var(--line);cursor:pointer;background:var(--raise);color:var(--ink);
transition:transform .2s var(--ease),box-shadow .2s var(--ease),background-color .2s,border-color .2s,color .2s,opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-1px) scale(1.04);border-color:var(--mute)}
.btn:active:not(:disabled){transform:scale(.95);transition-duration:.07s}
.btn.go{background:var(--gold);color:var(--goldink);border-color:var(--gold)}.btn.go:hover:not(:disabled){background:var(--gold2);border-color:var(--gold2);box-shadow:0 6px 18px rgba(var(--goldrgb),.4)}
.btn.danger{color:var(--bad)}.btn.danger:hover:not(:disabled){border-color:var(--bad);background:rgba(232,128,111,.08)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:7px 14px;font-size:14px}.btn.full{width:100%;margin-top:20px}.btn.full:hover:not(:disabled){transform:translateY(-1px)}
.btn.busy{position:relative;color:transparent!important}.btn.busy::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--goldink);border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{position:relative;display:flex;background:var(--raise);border-radius:999px;padding:4px;margin:16px 0 4px}
.tabs::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--panel);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.tabs.r::before{transform:translateX(100%)}
.tabs button{position:relative;flex:1;border:0;background:none;color:var(--mute);font:600 15px Figtree,sans-serif;padding:9px;border-radius:999px;cursor:pointer;transition:color .2s}
.tabs button.on,.tabs button:hover{color:var(--ink)}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1px}.err:not(:empty){animation:shake .35s}.ok{color:var(--ok)}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.links{display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:14px;flex-wrap:wrap}.links button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;transition:color .2s}.links button:hover{color:var(--ink)}
.me{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.me .name{font:700 28px 'Bricolage Grotesque',sans-serif;line-height:1.1}
.me .av{width:56px;height:56px;font-size:26px;transition:transform .35s var(--spring)}.me:hover .av{transform:scale(1.06) rotate(-5deg)}
.item{display:flex;gap:12px;align-items:center;padding:14px 12px;margin:0 -12px;border-radius:12px;flex-wrap:wrap;transition:background-color .2s}
.item+.item{border-top:1px solid var(--line)}.item:hover{background:rgba(var(--goldrgb),.05)}
.item .grow{flex:1;min-width:200px}.item b{display:block}.chip{display:inline-block;background:var(--raise);border-radius:999px;padding:1px 10px;font-size:13px;margin:4px 6px 0 0}
.count{font:700 13px Figtree,sans-serif;background:var(--gold);color:var(--goldink);border-radius:999px;padding:1px 9px;animation:pop .4s var(--spring)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.hic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--goldrgb),.12);color:var(--gold);flex:none;font:800 17px 'Bricolage Grotesque',sans-serif;transition:transform .35s var(--spring)}
.item:hover .hic{transform:scale(1.1) rotate(-6deg)}.hic svg{width:20px;height:20px}
.empty{display:flex;gap:14px;align-items:center;color:var(--mute);padding:4px 0}
.empty .hic{background:var(--raise);color:var(--mute)}
.banner{border:1px solid var(--gold);color:var(--gold2);border-radius:14px;padding:12px 16px;margin-top:16px;animation:rise .4s var(--ease)}.banner.warn{border-color:var(--bad);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:20px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 16px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4);
opacity:0;transform:translate(-50%,16px) scale(.96);pointer-events:none;transition:opacity .25s,transform .3s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Steps: sign-up progress and the getting started list */
.prog{display:flex;gap:6px;margin:4px 0 18px}.prog i{flex:1;height:4px;border-radius:4px;background:var(--raise);position:relative;overflow:hidden}
.prog i.on::after{content:'';position:absolute;inset:0;background:var(--gold);animation:fill .6s var(--ease) backwards;animation-delay:calc(var(--d,1) * 120ms)}
@keyframes fill{from{transform:scaleX(0);transform-origin:left}}
.prog-l{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.why{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.why li{display:flex;gap:12px;align-items:flex-start}.why li .hic{width:34px;height:34px;border-radius:10px}.why b{display:block}.why span{color:var(--mute);font-size:15px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.todo li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:transform .2s var(--ease),border-color .2s}
.todo li:hover{transform:translateX(3px);border-color:rgba(var(--goldrgb),.45)}
.todo li::before{content:attr(data-n);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--mute);font:800 14px 'Bricolage Grotesque',sans-serif}
.todo li.done::before{content:'✓';background:var(--ok);border-color:var(--ok);color:#13261a;animation:pop .4s var(--spring)}
.todo li.done b{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(166,163,154,.5)}
.todo b{display:block;font-size:15px}.todo span{color:var(--mute);font-size:14px}
.split{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="nav"><a class="brand" href="./"><img src="img/icon-192.png" alt=""><b>Hearth</b></a><div class="right"><a href="./">Download Hearth</a><span id="who"></span></div></div>
<div class="wrap"><div id="banners"></div><div id="app"><div class="card"><p class="mute">Loading…</p></div></div></div>
<div class="toast" id="toast"></div>
<script>
// Hearth accounts on the website. Logins and passwords: Firebase Authentication (its public web key below).
// Usernames, invites and "Your Hearths": the Hearth accounts service at accounts.hearthapp.cc.
const FB_KEY='AIzaSyD32zcWLYYPrgpkgzV286SZZe8zxH4Jj74', SVC='https://accounts.hearthapp.cc';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem('hearth-'+k))}catch{return null}},set(k,v){try{v==null?localStorage.removeItem('hearth-'+k):localStorage.setItem('hearth-'+k,JSON.stringify(v))}catch{}}};
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.color=bad?'var(--bad)':'';e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),4000)}
const ic={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',mail:'<path d="M3 5h18v14H3z"/><path d="m3 6 9 7 9-7"/>',servers:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',home:'<path d="M3 11 12 3l9 8v10H3z"/><path d="M9 21v-6h6v6"/>'};
const svg=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ic[k]+'</svg>';
const prog=(n,l)=>`<div class="prog-l">Step ${n} of 3 · ${l}</div><div class="prog">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}" style="--d:${i}"></i>`).join('')}</div>`;
const why=()=>`<div class="card" style="--i:1"><h2>What a Hearth account is for</h2><ul class="why"><li><div class="hic">${svg('user')}</div><div><b>One name for every Hearth</b><span>Friends who run a Hearth add you by your username. No passwords to share.</span></div></li><li><div class="hic">${svg('servers')}</div><div><b>Their servers, in your app</b><span>Servers you've been invited to show up on your Hearth's home page, with Start and Stop if your role allows it.</span></div></li><li><div class="hic">${svg('link')}</div><div><b>A free address for your own Hearth</b><span>Hosting servers yourself? Link your Hearth and open it from your phone anywhere.</span></div></li></ul><p class="mute" style="font-size:14px;margin:16px 0 0">You don't need an account to run servers on your own PC. <a href="./">Download Hearth</a></p></div>`;
const FB_ERR={EMAIL_EXISTS:'There is already an account with that email. Log in instead.',INVALID_EMAIL:"That email doesn't look right.",INVALID_LOGIN_CREDENTIALS:'Wrong email or password.',INVALID_PASSWORD:'Wrong email or password.',EMAIL_NOT_FOUND:'Wrong email or password.',USER_DISABLED:'This account is turned off.',TOO_MANY_ATTEMPTS_TRY_LATER:'Too many tries. Wait a few minutes and try again.',WEAK_PASSWORD:'Pick a longer password (at least 8 characters).',MISSING_PASSWORD:'Type your password.'};
async function fb(path,body){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+path+'?key='+FB_KEY,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));
if(!r.ok){const c=((j.error||{}).message||'').split(' : ')[0];throw new Error(FB_ERR[c]||FB_ERR[c.split(' ')[0]]||'Something went wrong ('+c+'). Try again.')}return j}
// The login: Firebase's refresh token is kept in this browser; ID tokens last an hour
let S=store.get('session');   // {idToken, refreshToken, expires, email}
async function token(force){if(!S)return null;if(!force&&S.expires>Date.now()+60e3)return S.idToken;
const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB_KEY,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(S.refreshToken)});
if(!r.ok){logout();return null}const j=await r.json();S={...S,idToken:j.id_token,refreshToken:j.refresh_token,expires:Date.now()+(+j.expires_in)*1000};store.set('session',S);return S.idToken}
function keep(j){S={idToken:j.idToken,refreshToken:j.refreshToken,expires:Date.now()+(+j.expiresIn)*1000,email:j.email};store.set('session',S)}
function logout(){S=null;store.set('session',null);store.set('pending-name',null);render()}
async function svc(m,p,b,auth=true){const h={};if(b)h['content-type']='application/json';if(auth){const t=await token();if(!t)throw Object.assign(new Error('Log in again.'),{status:401});h.authorization='Bearer '+t}
const r=await fetch(SVC+p,{method:m,headers:h,body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Error '+r.status),{status:r.status,data:j});return j}

let MODE=new URLSearchParams(location.search).get('mode')==='signup'?'signup':'login';
const field=(id,l,type='text',ac='off',ph='')=>`<label for="${id}">${l}</label><input id="${id}" type="${type}" autocomplete="${ac}" placeholder="${esc(ph)}" autocapitalize="off" spellcheck="false">`;
function gate(){const sign=MODE==='signup',reset=MODE==='reset';
$('#who').textContent='';
$('#app').innerHTML=`<div class="card">${sign?prog(1,'Your details'):''}<h1>${reset?'Reset your password':sign?'Make your Hearth account':'Welcome back'}</h1><p class="mute">${reset?"Type your account's email and we'll send you a link to pick a new password.":sign?'It takes a minute. Next, you confirm your email, and then you can be invited to servers.':'Log in to see invites to your friends\' servers and the Hearths you\'ve joined.'}</p>
${reset?'':`<div class="tabs ${sign?'r':''}"><button data-mode="login" class="${sign?'':'on'}">Log in</button><button data-mode="signup" class="${sign?'on':''}">Create account</button></div>`}
${sign?field('un','Username','text','username','3-20 letters, numbers or _')+'<div class="mute" id="unok" style="font-size:14px;margin-top:4px"></div>':''}
${field('em','Email','email','email')}${reset?'':field('pw',sign?'Password (8+ characters)':'Password','password',sign?'new-password':'current-password')}
${sign?field('pw2','Confirm password','password','new-password')+'<label class="ck"><input type="checkbox" id="age"> I am 13 or older</label>':''}
${sign?'<p class="mute" style="font-size:14px;margin:12px 0 0">By creating an account you agree to how Hearth handles your info: <a href="privacy">Privacy</a>.</p>':''}<div class="err" id="err"></div><button class="btn go full" id="go">${reset?'Send the link':sign?'Create my account':'Log in'}</button>
<div class="links">${reset?'<button data-mode="login">Back to log in</button>':'<button data-mode="reset">Forgot your password?</button>'}</div></div>${reset?'':why()}`;
const f=$('#un')||$('#em');if(f)f.focus()}
let unT;document.addEventListener('input',e=>{if(e.target.id!=='un')return;clearTimeout(unT);const n=e.target.value.trim(),o=$('#unok');if(!n){o.textContent='';return}
unT=setTimeout(async()=>{try{const r=await svc('GET','/v1/username?name='+encodeURIComponent(n),null,false);o.innerHTML=r.available?'<span class="ok">✓ Available</span>':'<span class="err">'+esc(r.error||'Taken')+'</span>'}catch{o.textContent=''}},350)});
async function submit(){const v=id=>($('#'+id)||{}).value||'',err=t=>{$('#err').textContent=t},b=$('#go');err('');b.disabled=true;b.classList.add('busy');try{
if(MODE==='reset'){await fb('sendOobCode',{requestType:'PASSWORD_RESET',email:v('em').trim()});$('#app').innerHTML='<div class="card"><div class="hic" style="margin-bottom:14px">'+svg('mail')+'</div><h1>Check your email</h1><p class="mute">If there\'s a Hearth account for that email, a link to pick a new password is on its way. Check spam too.</p><button class="btn" data-mode="login">Back to log in</button></div>';return}
if(MODE==='signup'){const n=v('un').trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(n))return err('Usernames are 3-20 letters, numbers or _.');if(v('pw').length<8)return err('Pick a password with at least 8 characters.');if(v('pw')!==v('pw2'))return err('The passwords don\'t match.');if(!$('#age').checked)return err('You must be 13 or older to make a Hearth account.');
const av=await svc('GET','/v1/username?name='+encodeURIComponent(n),null,false);if(!av.available)return err(av.error||'That username is taken.');
const j=await fb('signUp',{email:v('em').trim(),password:v('pw'),returnSecureToken:true});keep(j);store.set('pending-name',n);await fb('sendOobCode',{requestType:'VERIFY_EMAIL',idToken:j.idToken});return render()}
const j=await fb('signInWithPassword',{email:v('em').trim(),password:v('pw'),returnSecureToken:true});keep(j);render()
}catch(e){err(e.message)}finally{if(b){b.disabled=false;b.classList.remove('busy')}}}

async function render(){if(!S)return gate();let me;
try{me=await svc('GET','/v1/me')}catch(e){
if(e.status===401)return logout();
if(e.data&&e.data.needsUsername)return pickName();
if(e.data&&e.data.maintenance){$('#app').innerHTML='<div class="card"><h1>Back soon</h1><p class="mute">'+esc(e.message)+'</p></div>';return}
$('#app').innerHTML='<div class="card"><h1>Hmm</h1><p class="err">'+esc(e.message)+'</p><button class="btn" id="lo">Log out</button></div>';return}
$('#who').innerHTML='<span class="who"><span class="av">'+esc(me.username[0])+'</span>'+esc(me.username)+'</span><a href="#" id="lo2">Log out</a>';
const [box,mine]=await Promise.all([svc('GET','/v1/inbox').catch(()=>({invites:[]})),svc('GET','/v1/my-hearths').catch(()=>({hosting:[],joined:[]}))]);
const roleL={guest:'Guest',helper:'Helper',owner:'Owner'},open=u=>u?`<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">Open in browser</a>`:'';
const hosts=mine.hosting.length>0,joined=mine.joined.length>0,inv=box.invites.length;
const steps=[
 {done:true,t:'Make your Hearth account',d:'Done. Welcome!'},
 {done:joined,t:'Get invited to a friend\'s server',d:'Send your username to a friend who runs a Hearth. They add you on a server\'s People tab, and you accept the invite here or in your Hearth app.',a:`<button class="btn sm" data-copy="${esc(me.username)}">Copy username</button>`},
 {done:false,app:true,t:'Use it in the Hearth app',d:'Log in with this account when Hearth first opens (already using Hearth? Settings › Hearth account). Your friends\' servers then show on your home page, and invites pop up at the bell.',a:'<a class="btn sm go" href="./">Get Hearth</a>'},
 {done:hosts,t:'Hosting servers? Link your Hearth',d:'Setting Hearth up with this account links it for you (or Settings › Hearth account › Link this Hearth). With two-factor login on, it gets a free address you can open from anywhere.'}];
const left=steps.filter(x=>!x.done&&!(x.app&&(hosts||joined))).length;
const startCard=left>1?`<div class="card" style="--i:1"><div class="split"><h2 style="margin:0">Getting started</h2><span class="mute" style="font-size:14px">${4-left} of 4 done</span></div><p class="mute" style="margin:6px 0 14px">A few things to make the most of your account.</p><ol class="todo">${steps.map((x,i)=>{const d=x.done||(x.app&&(hosts||joined));return `<li data-n="${i+1}" class="${d?'done':''}"><div><b>${x.t}</b>${d?'':`<span>${x.d}</span>`}</div>${d?'':x.a||''}</li>`}).join('')}</ol></div>`:'';
const empty=(k,t)=>`<div class="empty"><div class="hic">${svg(k)}</div><div>${t}</div></div>`;
$('#app').innerHTML=`<div class="card" style="--i:0"><div class="me"><span class="av">${esc(me.username[0])}</span><div style="flex:1;min-width:160px"><div class="mute" style="font-size:14px">Your username</div><div class="name">${esc(me.username)}</div>${me.tag?`<div class="mute" style="font-size:14px">Friend tag <b>${esc(me.username)}#${esc(me.tag)}</b>: friends add you with this in the Friends tab of their Hearth app</div>`:''}</div><button class="btn sm" data-copy="${esc(me.tag?me.username+'#'+me.tag:me.username)}">Copy</button></div>
<p class="mute" style="margin:14px 0 0">This is the name friends type to invite you. Invites show up here and in your Hearth app.</p></div>
${startCard}
<div class="card" style="--i:2"><h2>Invites${inv?' <span class="count">'+inv+'</span>':''}</h2>${inv?box.invites.map(i=>`<div class="item"><div class="hic">${esc((i.hearth.name||'?')[0])}</div><div class="grow"><b>${esc(i.from)} invited you to ${esc(i.hearth.name)}</b>${i.servers.map(s=>`<span class="chip">${esc(s.name)} · ${roleL[s.role]||esc(s.role)}</span>`).join('')}</div><div class="row"><button class="btn sm go" data-acc="${esc(i.id)}">Accept</button><button class="btn sm" data-dec="${esc(i.id)}">Decline</button></div></div>`).join(''):empty('mail','No invites right now. When a friend adds you, it shows up here.')}</div>
<div class="card" style="--i:3"><h2>Your Hearths</h2>${joined||hosts?[...mine.hosting.map(h=>`<div class="item"><div class="hic">${svg('home')}</div><div class="grow"><b>${esc(h.name)}</b><span class="mute">You host this one${h.url?' · '+esc(h.url):''}</span></div>${open(h.url)}</div>`),...mine.joined.map(h=>`<div class="item"><div class="hic">${esc((h.name||'?')[0])}</div><div class="grow"><b>${esc(h.name)}</b><span class="mute">Hosted by ${esc(h.host||'?')}</span><div>${h.servers.map(s=>`<span class="chip">${esc(s.name)} · ${roleL[s.role]||esc(s.role)}</span>`).join('')}</div></div>${open(h.url)}</div>`)].join('')+'<p class="mute" style="font-size:14px;margin:12px 0 0">Tip: in the Hearth app, these open from your rail, already logged in.</p>':empty('servers','None yet. Accept an invite to join a friend\'s Hearth, or <a href="./">download Hearth</a> to host your own servers.')}</div>
<div class="card" style="--i:4"><h2>Account</h2><div class="split"><div><div class="mute" style="font-size:14px">Email</div><div>${esc(me.email)}</div></div><div class="row"><button class="btn sm" id="chpw">Change password</button><button class="btn sm" id="lo">Log out</button></div></div>
<hr><div class="split"><div><b>Delete account</b><div class="mute" style="font-size:14px">Removes your username, invites and linked Hearths for good.</div></div><button class="btn sm danger" id="del">Delete my account</button></div>
<p class="mute" style="font-size:14px;margin:16px 0 0"><a href="privacy">What Hearth keeps about you</a></p></div>`;
banners(me.announcements)}
function pickName(){const pending=store.get('pending-name')||'';
$('#who').innerHTML='';$('#app').innerHTML=`<div class="card">${prog(2,'Confirm your email')}<div class="hic" style="margin-bottom:14px">${svg('mail')}</div><h1>Check your inbox</h1><p class="mute">We sent a link to <b>${esc(S.email||'your email')}</b>. Open it, then come back here and click <b>I've confirmed it</b>. Can't find it? Check your spam folder.</p>
${field('un','Your username','text','username','3-20 letters, numbers or _')}<div class="mute" id="unok" style="font-size:14px;margin-top:4px"></div><label class="ck"><input type="checkbox" id="age" ${pending?'checked':''}> I am 13 or older</label>
<div class="err" id="err"></div><button class="btn go full" id="claim">I've confirmed it</button><div class="links"><button id="resend">Send the email again</button><button id="lo">Log out</button></div></div>`;
$('#un').value=pending}
async function claim(){const err=t=>{$('#err').textContent=t},n=$('#un').value.trim();err('');try{await token(true);
await svc('POST','/v1/me',{username:n,age13:$('#age').checked});store.set('pending-name',null);toast('Welcome to Hearth, '+n+'! Here\'s what to do next.');render()}catch(e){err(e.message)}}
function banners(list){$('#banners').innerHTML=(list||[]).map(a=>`<div class="banner ${a.level==='warn'?'warn':''}">${esc(a.text)}</div>`).join('')}
document.addEventListener('click',async e=>{const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
if(d.mode){MODE=d.mode;return gate()}
if(t.id==='go')return submit();
if(t.id==='claim')return claim();
if(t.id==='lo'||t.id==='lo2'){e.preventDefault();return logout()}
if(t.id==='resend'){try{await fb('sendOobCode',{requestType:'VERIFY_EMAIL',idToken:await token()});toast('Sent. Check your email.')}catch(x){toast(x.message,true)}return}
if(t.id==='del'){if(prompt('This deletes your Hearth account for good: your username, invites and linked Hearths. Type DELETE to go on.')!=='DELETE')return;try{await svc('DELETE','/v1/me');await fb('delete',{idToken:await token()});toast('Your account is deleted.');logout()}catch(x){toast(x.message+' (if it says log in again, log out and back in, then try again)',true)}return}
if(t.id==='chpw'){try{await fb('sendOobCode',{requestType:'PASSWORD_RESET',email:S.email});toast('We emailed you a link to pick a new password.')}catch(x){toast(x.message,true)}return}
if(d.copy){navigator.clipboard.writeText(d.copy).then(()=>toast('Copied'),()=>{});return}
if(d.acc||d.dec){t.disabled=true;try{const r=await svc('POST','/v1/invites/'+(d.acc||d.dec)+'/'+(d.acc?'accept':'decline'));toast(d.acc?'Accepted! '+(r.hearth&&r.hearth.url?'Open it from Your Hearths.':''):'Declined');render()}catch(x){toast(x.message,true);t.disabled=false}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;if($('#go'))submit();else if($('#claim'))claim()});
svc('GET','/v1/status',null,false).then(s=>{if(!S)banners(s.announcements);if(s.maintenance&&!S)$('#banners').innerHTML+='<div class="banner warn">'+esc(s.message||'Hearth accounts are down for maintenance.')+'</div>'}).catch(()=>{});
render();
</script>
</body>
</html>
